<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Tech Studies Programme</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
</head>
<body>
    <main>
        <h1>Tech Studies Programme</h1>

        <p>
            Welcome to the Tech Studies Programme!
            This programme introduces students to programming,
            software development, and computer systems.
            Students learn through practical projects and teamwork.
        </p>

        <h2>Test API Routes</h2>

        <div class="buttons">
            <button data-path="/api/courses">Get Courses</button>
            <button data-path="/api/status">Server Status</button>
            <button data-path="/api/headers">Request Headers</button>
            <button data-path="/api/subscribe">Subscribe</button>
            <button data-path="/api/admin">Admin</button>
            <button data-path="/api/stats">Request Stats</button>
            <button data-path="/api/does-not-exist">Test 404</button>
        </div>

        <h2>Response</h2>
        <pre id="result">Click a button to see the response.</pre>
    </main>
</body>
</html>
